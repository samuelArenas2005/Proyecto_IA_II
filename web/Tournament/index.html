<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knight Energy - Torneo de heuristicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../menu.css" />
  <link rel="stylesheet" href="tournament.css" />
</head>
<body>
  <div id="bg-image"></div>
  <div id="overlay"></div>
  <div id="particles"></div>

  <main id="menu-root" class="tournament-root">
    <section class="tournament-shell">
      <header class="tournament-header">
        <h1 class="brand-title">KNIGHT ENERGY</h1>
        <h2 class="brand-subtitle">TORNEO DE HEURISTICAS</h2>
      </header>

      <div class="tournament-view tournament-view--selection" id="tournament-selection-view">
        <section class="tournament-panel tournament-panel--setup">
          <h3 class="editor-section-title">CONFIGURACION</h3>
          <div class="tournament-controls">
            <label>
              Participantes
              <select id="participant-count" class="tournament-select">
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="8">8</option>
                <option value="16">16</option>
              </select>
            </label>
            <label>
              Profundidad
              <select id="tournament-depth" class="tournament-select">
                <option value="2" selected>2</option>
                <option value="4">4</option>
                <option value="6">6</option>
              </select>
            </label>
          </div>

          <button class="menu-btn custom-heuristic-button" id="btn-custom-heuristic">
            <span class="menu-btn__label">+ HEURISTICA PERSONALIZADA</span>
          </button>

          <div class="heuristic-list" id="heuristic-list"></div>

          <div class="tournament-actions">
            <button class="menu-btn" id="btn-run-tournament"><span class="menu-btn__label">INICIAR TORNEO</span></button>
            <button class="menu-btn menu-btn--back" onclick="irAlMenu()"><span class="menu-btn__label">REGRESAR</span></button>
          </div>
        </section>
      </div>

      <section class="tournament-view tournament-view--bracket" id="tournament-bracket-view" hidden>
        <div class="bracket-toolbar">
          <div>
            <h3 class="editor-section-title" id="bracket-title">BRACKET</h3>
            <p class="bracket-status" id="champion-box">Selecciona heuristicas para iniciar.</p>
          </div>
          <div class="bracket-toolbar-actions">
            <button class="menu-btn menu-btn--back" id="btn-back-selection"><span class="menu-btn__label">NUEVO TORNEO</span></button>
            <button class="menu-btn menu-btn--back" onclick="irAlMenu()"><span class="menu-btn__label">REGRESAR</span></button>
          </div>
        </div>
        <div class="bracket-scroll">
          <div class="bracket-board" id="bracket-board"></div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="menu-toast"></div>
  <div id="heuristic-modal" class="modal-overlay">
    <form class="custom-modal-card" id="custom-heuristic-form">
      <h2 class="modal-title">Nueva heuristica</h2>
      <label class="custom-name-label">Nombre <input id="custom-heuristic-name" maxlength="40" required /></label>
      <div class="custom-weight-grid" id="custom-weight-grid"></div>
      <div class="custom-modal-actions">
        <button type="submit" class="menu-btn"><span class="menu-btn__label">GUARDAR</span></button>
        <button type="button" class="menu-btn menu-btn--back" id="btn-close-heuristic-modal"><span class="menu-btn__label">CANCELAR</span></button>
      </div>
    </form>
  </div>

  <div id="winner-modal" class="modal-overlay">
    <div class="winner-modal-card">
      <p class="winner-kicker">CAMPEONA DEL TORNEO</p>
      <img id="winner-symbol" class="winner-symbol" src="../assets/NewSprints/personalizated.png" alt="" />
      <h2 class="modal-title" id="winner-title">Heuristica ganadora</h2>
      <button type="button" class="menu-btn" id="btn-close-winner-modal"><span class="menu-btn__label">CERRAR</span></button>
    </div>
  </div>

  <script src="/eel.js" onerror="console.warn('eel.js no disponible')"></script>
  <script src="tournament.js"></script>
</body>
</html>
