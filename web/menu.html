<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knight Energy – Menú Principal</title>
  <meta name="description" content="Juego de caballos con inteligencia artificial estilo medieval." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700;900&family=MedievalSharp&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="menu.css" />
</head>
<body>

  <!-- Fondo de imagen completa -->
  <div id="bg-image"></div>
  <div id="overlay"></div>

  <!-- Partículas decorativas -->
  <div id="particles"></div>

  <main id="menu-root">

    <!-- ═══════════════════════════════════════════ -->
    <!-- PANEL PRINCIPAL -->
    <!-- ═══════════════════════════════════════════ -->
    <div class="menu-panel" id="main-panel">

      <h1 class="brand-title">KNIGHT ENERGY</h1>

      <!-- Snitch dorada decorativa -->
      <div class="snitch-container">
        <img src="assets/NewSprints/snitch_dorada.png" alt="Snitch Dorada" class="snitch-img" />
      </div>

      <nav class="menu-buttons" aria-label="Menú principal">

        <!-- PLAY -->
        <button id="btn-inicio" class="menu-btn" onclick="irASeleccionNivel()" title="Iniciar partida">
          <span class="menu-btn__label">PLAY</span>
        </button>

        <!-- LEVEL MAP -->
        <button id="btn-level-map" class="menu-btn" onclick="window.location.href='RenderMap/index.html'" title="Level Map">
          <span class="menu-btn__label">LEVEL MAP</span>
          <img src="assets/NewSprints/icon_map.png" alt="" class="menu-btn__icon-img" />
        </button>

        <!-- GAME EDITOR -->
        <button id="btn-game-editor" class="menu-btn" onclick="window.location.href='editor.html'" title="Game Editor">
          <span class="menu-btn__label">GAME EDITOR</span>
          <img src="assets/NewSprints/setting.png" alt="" class="menu-btn__icon-img" />
        </button>

        <!-- EXIT -->
        <button id="btn-exit" class="menu-btn menu-btn--exit" onclick="exitGame()" title="Salir del juego">
          <span class="menu-btn__label">EXIT</span>
        </button>

      </nav>

      <footer class="menu-footer">
        <span>Version 1.0 (Prototype) | © Knight Energy Games</span>
      </footer>

    </div>

    <!-- ═══════════════════════════════════════════ -->
    <!-- PANEL DE SELECCIÓN DE DIFICULTAD -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="nivel-panel" class="menu-panel" style="display: none; opacity: 0;">

      <h1 class="brand-title">KNIGHT ENERGY</h1>
      <h2 class="brand-subtitle">SELECCIONAR DIFICULTAD</h2>

      <!-- Snitch dorada decorativa -->
      <div class="snitch-container">
        <img src="assets/NewSprints/snitch_dorada.png" alt="Snitch Dorada" class="snitch-img" />
      </div>

      <nav class="menu-buttons" aria-label="Selección de dificultad">

        <!-- PRINCIPIANTE - Depth 2 -->
        <div class="difficulty-btn-wrapper">
          <img src="assets/NewSprints/depth_2.png"   alt="Depth 2"   class="diff-side diff-side--left" />
          <button id="btn-principiante" class="menu-btn menu-btn--difficulty" onclick="seleccionarNivelYJugar('principiante')" title="Profundidad 2">
            <span class="menu-btn__label">PRINCIPIANTE</span>
          </button>
          <img src="assets/NewSprints/warrior_1.png" alt="Warrior 1" style="scale: 0.65; transform: translateY(-80%);" class="diff-side diff-side--right" />
        </div>

        <!-- AMATEUR - Depth 4 -->
        <div class="difficulty-btn-wrapper">
          <img src="assets/NewSprints/depth_4.png"   alt="Depth 4"   class="diff-side diff-side--left" />
          <button id="btn-amateur" class="menu-btn menu-btn--difficulty" onclick="seleccionarNivelYJugar('amateur')" title="Profundidad 4">
            <span class="menu-btn__label">AMATEUR</span>
          </button>
          <img src="assets/NewSprints/warrior_2.png" alt="Warrior 2" style="scale: 0.7; transform: translateY(-70%);" class="diff-side diff-side--right" />
        </div>

        <!-- EXPERTO - Depth 6 -->
        <div class="difficulty-btn-wrapper">
          <img src="assets/NewSprints/depth_6.png"   alt="Depth 6"   class="diff-side diff-side--left" />
          <button id="btn-experto" class="menu-btn menu-btn--difficulty" onclick="seleccionarNivelYJugar('experto')" title="Profundidad 6">
            <span class="menu-btn__label">EXPERTO</span>
          </button>
          <img src="assets/NewSprints/warrior_3.png" alt="Warrior 3" class="diff-side diff-side--right" />
        </div>

        <!-- REGRESAR -->
        <button id="btn-regresar" class="menu-btn menu-btn--back" onclick="regresarAlMenu()" title="Volver al menú">
          <span class="menu-btn__label">REGRESAR</span>
        </button>

      </nav>

      <footer class="menu-footer">
        <span>© Knight Energy Games</span>
      </footer>

    </div>

  </main>

  <!-- Sparkle decorativo esquina inferior derecha -->
  <div class="sparkle-corner" aria-hidden="true">✦</div>

  <script src="/eel.js" onerror="console.warn('eel.js no disponible')"></script>
  <script src="api.js"></script>
  <script src="menu.js"></script>
</body>
</html>
