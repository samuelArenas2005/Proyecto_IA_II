<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knight Energy – Tablero</title>
  <meta name="description" content="Tablero 2D 8×8 de Knight Energy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Top-bar ──────────────────────────────────── -->
  <header class="top-bar">
    <div class="top-bar__left">
      <button id="btn-back" class="btn-back" title="Volver al menú" onclick="irAlMenu()">
        &laquo;
      </button>
      <span class="logo-text">Knight <em>Energy</em></span>
      <div class="header-divider"></div>
      <div class="header-titles">
        <span class="nav-algo-title" id="nav-nivel-title">Principiante</span>
        <span class="nav-map-title" id="nav-turn-title">Turno: IA</span>
      </div>
    </div>
    <div class="top-bar__right">
      <button id="btn-theme" class="btn-theme" title="Cambiar tema" onclick="toggleTheme()">
        <span id="icon-theme">☼</span>
      </button>
    </div>
  </header>

  <!-- ── Layout principal (tablero | panel info) ── -->
  <div class="game-layout">

    <!-- Sección tablero (izquierda) -->
    <section class="board-section">
      <div id="map-canvas"></div>
    </section>

    <!-- Panel de información (derecha) -->
    <aside class="info-panel">

      <!-- ── Jugadores VS ───────────────────────── -->
      <div class="duel-block">

        <div class="duel-player">
          <div class="duel-player__name duel-player__name--white">IA (Blanco)</div>
          <div class="duel-stat-row">
            <span class="duel-icon">★</span>
            <div class="hp-bar-track hp-bar-track--points">
              <div class="hp-bar-fill hp-bar-fill--points" id="white-points-bar"></div>
            </div>
            <span class="duel-val" id="white-points">0</span>
          </div>
          <div class="duel-stat-row">
            <span class="duel-icon">⚡</span>
            <div class="hp-bar-track hp-bar-track--energy">
              <div class="hp-bar-fill hp-bar-fill--energy" id="white-energy-bar"></div>
            </div>
            <span class="duel-val" id="white-energy">7</span>
          </div>
        </div>

        <div class="duel-vs">VS</div>

        <div class="duel-player duel-player--right">
          <div class="duel-player__name duel-player__name--black">Tú (Negro)</div>
          <div class="duel-stat-row duel-stat-row--rtl">
            <span class="duel-val" id="black-points">0</span>
            <div class="hp-bar-track hp-bar-track--points">
              <div class="hp-bar-fill hp-bar-fill--points" id="black-points-bar"></div>
            </div>
            <span class="duel-icon">★</span>
          </div>
          <div class="duel-stat-row duel-stat-row--rtl">
            <span class="duel-val" id="black-energy">7</span>
            <div class="hp-bar-track hp-bar-track--energy">
              <div class="hp-bar-fill hp-bar-fill--energy" id="black-energy-bar"></div>
            </div>
            <span class="duel-icon">⚡</span>
          </div>
        </div>
      </div>

      <!-- ── Separador ──────────────────────────── -->
      <div class="info-sep"></div>

      <!-- ── Estado de la partida ───────────────── -->
      <div id="game-status" class="game-status">Cargando partida...</div>

    </aside>
  </div>


  <!-- Toast -->
  <div class="toast" id="toast"><span id="toast-msg"></span></div>

  <!-- Modal fin del juego -->
  <div id="game-over-modal" class="report-modal">
    <div class="report-modal__card medieval-panel">
      <div class="report-modal__header">
        <h3 id="game-over-title">Fin del juego</h3>
        <button id="btn-close-game-over" title="Cerrar">✕</button>
      </div>
      <div id="game-over-content" class="report-modal__content"></div>
      <button class="medieval-btn" onclick="nuevaPartida()">Jugar de nuevo</button>
    </div>
  </div>

  <script src="/eel.js"></script>
  <script src="../api.js"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
